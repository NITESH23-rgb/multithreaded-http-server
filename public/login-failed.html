<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Failed</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .error-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
    }
    .error-icon {
      font-size: 4em;
      color: #e74c3c;
      margin-bottom: 20px;
    }
    .error-container h1 {
      color: #e74c3c;
      margin-bottom: 10px;
    }
    .error-container p {
      font-size: 1.2em;
      margin-bottom: 20px;
      color: #555;
    }
    a {
      display: inline-block;
      padding: 12px 25px;
      background: #e74c3c;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    a:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">❌</div>
    <h1>Login Failed</h1>
    <p>Invalid username or password. Please try again.</p>
    <a href="login.html">Back to Login</a>
  </div>
</body>
</html>
